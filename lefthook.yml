pre-commit:
  jobs:
    - name: format-and-lint
      run: bun run fix
      stage_fixed: true
    - name: typescript
      run: bun run tscheck
pre-push:
  jobs:
    - name: build
      run: bun run build
    - name: tests
      run: bun run test
commit-msg:
  commands:
    conventional-commit:
      run: bun run commitlint --edit {1}
