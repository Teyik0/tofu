const playbackStates={buffering:['wifi','Waiting for video pieces','The file is still downloading on Home Mac. Playback will continue when the next pieces arrive.'],offline:['refresh','Reconnecting to Home Mac','Your position is saved at 08:42. Playback will resume here when the connection returns.'],paused:['pause','This download is paused','Ask someone with Management access to resume this download on Home Mac.'],revoked:['lock','Access was removed','Ask the owner of Home Mac for a new invitation. Automatic reconnection has stopped.'],certificate:['shield','Secure playback unavailable','This device must trust the server’s certificate before playback can start.'],ready:['play','Ready to continue','Your audio track, subtitles and position are restored. Press Play to continue.']};
function playback(){const [ico,title,copy]=playbackStates[state.play];return `${native()}<main class="player"><div class="player-head"><button aria-label="Back to library" data-action="back-library">${icon('arrow')}</button><div><h3>Frieren · Episode 12</h3><p>Home Mac / Anime</p></div><span style="flex:1"></span>${badge('Playback')}</div><div class="player-stage"><span class="big-icon">${icon(ico)}</span><h2 style="font-size:19px">${title}</h2><p>${copy}</p>${state.play==='offline'?btn('Retry now','retry-play','','refresh'):state.play==='ready'?btn('Play','demo-play','','play'):state.play==='certificate'?btn('Connection details','trust','','shield'):state.play==='revoked'?btn('Choose another server','manager','','server'):''}</div><div class="timeline" aria-label="Playback position 8 minutes 42 seconds"></div><div class="player-controls"><button aria-label="Play" data-action="demo-play">${icon('play')}</button>${icon('volume')}<span>08:42 / 24:10</span><span class="spacer"></span><button aria-label="Audio and subtitles" data-action="tracks">${icon('settings')}</button><button aria-label="Fullscreen preview" data-action="fullscreen">${icon('expand')}</button></div><div class="scenario" aria-label="Preview player scenarios">${[['buffering','Downloading'],['offline','Network lost'],['paused','Paused torrent'],['revoked','Revoked'],['certificate','Certificate'],['ready','Recovered']].map(([id,label])=>`<button data-play="${id}" class="${state.play===id?'active':''}" aria-pressed="${state.play===id}">${label}</button>`).join('')}</div><p style="font-size:10px;color:#7c8a71">Scenario controls above belong to this prototype, not the final player.</p></main>`}
function render(){document.getElementById('app').innerHTML=({sharing,servers,pairing,playback})[state.screen]();document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===state.screen));own()}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('visible');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('visible'),3600)}
function close(){document.getElementById('modal').close()}
function modal(title,body,actions=''){document.getElementById('dialog-content').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="btn ghost icon" data-action="close" aria-label="Close dialog">${icon('x')}</button></div>${body}${actions?`<div class="dialog-footer">${actions}</div>`:''}`;const d=document.getElementById('modal');if(!d.open)d.showModal()}
function invitation(){modal('Pair another device',`<p>Create one-time access to <strong>${state.selected}</strong>.</p><label for="invitation-label">Invitation label</label><input id="invitation-label" value="Living room iPad"><label>Access</label><label class="radio-row"><input type="radio" name="grant" value="play" checked><span class="copy">Playback<small>Browse, play and save personal progress.</small></span></label><label class="radio-row"><input type="radio" name="grant" value="manage"><span class="copy">Management<small>Add and control downloads. File deletion is separate.</small></span></label><label class="radio-row"><input type="radio" name="grant" value="admin"><span class="copy">Administration<small>Manage server settings, integrations and device access.</small></span></label><label class="check-row" id="delete-grant" style="display:none"><input type="checkbox">Allow deleting downloaded files</label><p class="form-note">You can grant only permissions you hold yourself.</p><div class="callout info" style="margin-top:16px">${icon('info')}Expires after 10 minutes. A new device starts with its own playback profile.</div>`,btn('Cancel','close')+btn('Create invitation','create-invitation','primary'))}
function makeQR(){let html='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){let corner=((x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13)),lx=x>13?x-14:x,ly=y>13?y-14:y;let filled=corner?lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4):((x*7+y*11+x*y)%7<3);html+=`<i class="${filled?'fill':''}"></i>`}return html}
const actions={
'close':close,'manager':()=>{close();state.screen='servers';render()},'picker':()=>modal('Choose a server',`<p>Open a workspace from this desktop app.</p><div class="server-selector"><button data-action="open-local">${icon('laptop')}<span class="copy"><strong>Home Mac</strong><p>This computer · ${state.local?'Ready':'Server off'}</p></span>${state.selected==='Home Mac'?icon('check'):''}</button><button data-action="offline">${icon('server')}<span class="copy"><strong>Studio</strong><p>Remote · Offline</p></span>${badge('Offline','warn')}</button></div>`,btn('Manage servers','manager')+btn('Add server','add','primary','plus')),
'open-local':()=>{close();if(!state.local){actions['enable-local']();return}state.selected='Home Mac';state.screen='sharing';render()},
'add':()=>modal('Add a server',`<p>Paste a one-time invitation from another Tofu.</p><label for="pair-link">Invitation link or HTTPS address</label><input id="pair-link" placeholder="https://your-server/pair#…" autocomplete="off"><label for="pair-code">Pairing code <span class="muted">(for an address without a link)</span></label><input id="pair-code" placeholder="Paste the code from the server" autocomplete="off"><p class="form-note">Create an invitation in Settings → Connections on the server. Credentials are sent only after the connection is verified.</p><div class="divider"></div>${btn('Find nearby servers','discover','ghost','wifi')}`,btn('Cancel','close')+btn('Check connection','check-add','primary')),
'check-add':()=>modal('Connection verified',`<div class="callout">${icon('shield')}<div><strong>Home Mac</strong><br>home-mac.tail-example.ts.net<br>HTTPS · Server identity verified</div></div><p style="margin-top:15px">This example invitation grants Playback access. Continue to choose a device name and open your library.</p>`,btn('Back','add')+btn('Continue','show-pair','primary')),
'show-pair':()=>{close();state.screen='pairing';state.pairStep=0;render()},
'discover':()=>modal('Nearby servers',`<p>Example discovery results. Names are verified when you connect.</p><div class="server-selector"><button data-action="discovered">${icon('server')}<span class="copy"><strong>Home Mac</strong><p>home-mac.local · Certificate trust required</p></span>${icon('chevron')}</button></div><p class="form-note" style="margin-top:16px">A nearby server still needs a pairing invitation. Discovery availability depends on your network and system permissions.</p>`,btn('Enter address instead','add')),

'offline':()=>{state.selected='Studio';render();modal('Studio is unavailable',`<div class="empty" style="padding:20px 0"><span class="big-icon">${icon('wifi')}</span><p>We couldn’t reach Studio. Make sure its computer is awake and both devices are on the expected network.</p></div><div class="address">https://studio.tail-example.ts.net</div><p class="form-note">Your saved connection is kept. The local connection manager remains available.</p>`,btn('Forget…','forget','ghost')+btn('Edit address','edit-address')+btn('Retry','retry-offline','primary','refresh'))},

'verify-address':()=>toast('Prototype: address verification would run here. No network request was made.'),
'forget':()=>modal('Forget Studio on this device?',`<p>This removes its saved connection and local credentials. Because Studio is offline, its session cannot be revoked right now. You can revoke it on Studio later.</p><p style="margin-top:10px">Downloads on Studio continue.</p>`,btn('Keep server','close')+btn('Forget server','forget-confirm','danger')),
'forget-confirm':()=>{close();toast('Demo: connection forgotten locally; remote revocation is still needed.')},

'fullscreen':()=>toast('The production player uses this device’s fullscreen capabilities.'),
'tracks':()=>modal('Audio and subtitles',`<label for="audio">Audio</label><select id="audio" style="width:100%"><option>Japanese · Stereo</option><option>English · Stereo</option></select><label for="subtitles">Subtitles</label><select id="subtitles" style="width:100%"><option>English</option><option>Off</option></select><p class="form-note" style="margin-top:14px">Remembered for this device. Reconnection keeps your choices.</p>`,btn('Done','close','primary')),
'trust':()=>modal('Trust your local server',`<p>Browsers need a trusted HTTPS certificate to play videos from another computer.</p><div class="grants"><div><strong>1.</strong> Get the certificate from your authenticated host.</div><div><strong>2.</strong> Compare its fingerprint on both devices.</div><div><strong>3.</strong> Install and trust it using your device’s settings.</div><div><strong>4.</strong> Do the same on this computer: its own Tofu window uses the same HTTPS address.</div></div><div class="callout warning">${icon('lock')}A QR code or a browser warning bypass does not establish certificate trust. Tailscale HTTPS is an alternative.</div><label for="platform">Show setup instructions for</label><select id="platform" style="width:100%"><option>iPhone / iPad</option><option>macOS</option><option>Windows</option><option>Android</option><option>Linux</option></select><p class="form-note">Platform-specific steps and fingerprint verification are required in the final implementation.</p>`,btn('Use Tailscale','use-tailscale')+btn('Check again','check-lan','primary')),
'use-tailscale':()=>{close();state.screen='sharing';state.transport='tailscale';render()},
'check-tailscale':()=>{state.tsChecked=true;render();toast('Example check: Tailscale is signed in and HTTPS is enabled.')},
'check-lan':()=>toast('Prototype: certificate trust must be checked on the actual device.'),
'custom-check':()=>toast('Prototype: HTTPS, server identity and isolation headers would be validated.'),
'section-general':()=>modal('General settings · '+state.selected,`<p>Server controls are labeled with their target host. Device-only actions, such as file associations and client-only mode, remain in the trusted desktop manager.</p>`,btn('Open desktop manager','manager','primary')),
'section-appearance':()=>modal('Appearance · This device',`<p>Theme and player preferences apply to this device. Changing them does not change another viewer’s interface.</p><label for="theme">Theme</label><select id="theme" style="width:100%"><option>System</option><option>Light</option><option>Dark</option></select>`,btn('Done','close','primary')),
'section-downloads':()=>modal('Downloads · '+state.selected,`<p>Storage paths and bandwidth belong to ${state.selected}. A remote window must never open a file picker on the wrong computer.</p><div class="callout info" style="margin-top:17px">${icon('shield')}Host settings require Administration access. Management can operate downloads within granted permissions.</div>`,btn('Done','close','primary')),
'section-updates':()=>modal('Updates',`<p>Desktop app updates belong to this device. Updating ${state.selected} is a separate server administration action with explicit host identity.</p>`,btn('Done','close','primary'))
};
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.screen){state.screen=el.dataset.screen;render()}else if(el.dataset.transport){state.transport=el.dataset.transport;render()}else if(el.dataset.play){state.play=el.dataset.play;render()}else if(el.dataset.action){actions[el.dataset.action]?.()}});
document.getElementById('role').addEventListener('change',e=>{state.role=e.target.value;if(state.screen!=='sharing')state.screen='sharing';render()});
document.addEventListener('change',e=>{if(e.target.name==='grant'){document.getElementById('delete-grant').style.display=e.target.value==='play'?'none':'flex'}});
render();
console.log('Tofu prototype ready: 4 screens, mocked interactions only, no network requests.');
</script></body></html>
