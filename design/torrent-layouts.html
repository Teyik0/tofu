<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Tofu — Torrent workspace proposals</title>
    <style>
    /* biome-ignore-all lint/style/noDescendingSpecificity: The independent proposal themes intentionally override shared styles. */
    :root {
      --ink: #ebece5;
      --quiet: #9caa96;
      --line: #30392d;
      --paper: #171d16;
      --accent: #c5d9a6;
      --radius: 16px;
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      background: transparent;
    }
    body {
      font-family: "Avenir Next", "Gill Sans", sans-serif;
      font-size: 14px;
      color: var(--foreground, #e8ebe2);
    }
    button,
    input,
    select {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    button {
      color: inherit;
    }
    .proposal-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 16px;
    }
    .proposal-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-width: 0;
      padding: 0;
      margin: 0;
      border: 0;
    }
    .proposal-tab {
      padding: 10px 14px;
      font-size: 12px;
      color: var(--muted-foreground, #a7b09f);
      background: transparent;
      border: 1px solid var(--border, #353b32);
      border-radius: 9px;
    }
    .proposal-tab span {
      margin-right: 7px;
      font-family: monospace;
      opacity: 0.65;
    }
    .proposal-tab[aria-pressed="true"] {
      color: #263020;
      background: #d2dfb9;
      border-color: #d2dfb9;
    }
    .fit-button {
      padding: 9px 14px;
      font-size: 11px;
      color: var(--muted-foreground, #b2b9ad);
      white-space: nowrap;
      background: transparent;
      border: 1px solid var(--border, #3c453a);
      border-radius: 999px;
    }
    .fit-button:hover {
      color: var(--foreground, #e8ebe2);
      border-color: var(--accent, #8da877);
    }
    .fit-hint {
      display: none;
      margin: 0 0 12px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted-foreground, #9fa998);
    }
    .stage {
      overflow: auto;
      background: #10150f;
      border-radius: var(--radius);
    }
    .stage.fit {
      overflow: hidden;
    }
    .screen-wrap {
      width: 1280px;
    }
    .app {
      --bg: #171d16;
      --nav: #111710;
      --list: #1b2219;
      --panel: #20271d;
      --line: #333d2e;
      --text: #e5eadd;
      --muted: #a1af97;
      --accent: #c5d9a6;
      --selected: #303e27;
      --amber: #e6bb74;
      --danger: #e29a86;
      width: 1280px;
      height: 762px;
      overflow: hidden;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .app[data-mode="directory"] {
      --bg: #1b2021;
      --nav: #121718;
      --list: #1b2021;
      --panel: #232a2b;
      --line: #354042;
      --text: #e1e9e7;
      --muted: #a0b2b1;
      --accent: #9dd3c8;
      --selected: #283e3b;
      --amber: #e3bc83;
    }
    .app[data-mode="library"] {
      --bg: #f7f6f0;
      --nav: #eeeee5;
      --list: #f4f3ec;
      --panel: #fffef9;
      --line: #dddfd1;
      --text: #303b2c;
      --muted: #6b7863;
      --accent: #476a3d;
      --selected: #e2e8d7;
      --amber: #946621;
      --danger: #b64f3b;
      color-scheme: light;
    }
    .titlebar {
      display: flex;
      gap: 7px;
      align-items: center;
      height: 39px;
      padding: 0 17px;
      background: var(--nav);
      border-bottom: 1px solid var(--line);
    }
    .traffic {
      width: 10px;
      height: 10px;
      background: #fa6d66;
      border-radius: 50%;
    }
    .traffic:nth-child(2) {
      background: #ecc057;
    }
    .traffic:nth-child(3) {
      background: #7eae63;
    }
    .window-title {
      padding-right: 48px;
      margin: auto;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.03em;
    }
    .workspace {
      display: grid;
      grid-template-columns: 178px 404px minmax(0, 1fr);
      height: 686px;
    }
    .workspace > * {
      min-height: 0;
    }
    .app[data-mode="focus"] .workspace {
      grid-template-rows: 64px minmax(0, 1fr);
      grid-template-columns: 178px 620px minmax(0, 1fr);
    }
    .app[data-mode="focus"] .nav {
      grid-row: 1 / -1;
      grid-column: 1;
    }
    .app[data-mode="focus"] .torrent-pane {
      grid-row: 2;
      grid-column: 2;
    }
    .app[data-mode="focus"] .detail {
      grid-row: 2;
      grid-column: 3;
      padding: 20px 24px;
    }
    .library-topbar {
      display: flex;
      grid-row: 1;
      grid-column: 2 / -1;
      gap: 20px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 22px;
      border-bottom: 1px solid var(--line);
    }
    .library-title {
      display: flex;
      gap: 11px;
      align-items: center;
      min-width: 0;
    }
    .library-glyph {
      display: grid;
      flex-shrink: 0;
      place-items: center;
      width: 35px;
      height: 35px;
      color: var(--accent);
      background: var(--list);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .library-heading {
      min-width: 0;
    }
    .library-heading h1 {
      font-size: 18px;
      font-weight: 550;
      line-height: 1.25;
      letter-spacing: -0.4px;
    }
    .topbar-path {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .library-actions {
      display: flex;
      flex-shrink: 0;
      gap: 8px;
      align-items: center;
    }
    .library-actions .automations-button {
      display: flex;
      gap: 4px;
      align-items: center;
      min-height: 33px;
      padding: 7px 9px;
    }
    .automations-button span {
      font-size: 10px;
    }
    .torrent-toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    .torrent-toolbar .search {
      flex: 1;
      min-width: 0;
      padding: 7px 9px;
      margin: 0;
    }
    .torrent-toolbar .filters {
      flex: 1;
      gap: 3px;
      padding: 0;
      border: 0;
    }
    .torrent-toolbar .filter {
      padding: 6px 8px;
    }
    .torrent-toolbar .sort {
      max-width: 80px;
    }
    .app[data-mode="focus"] .torrent-card {
      padding: 11px 18px 10px;
    }
    .app[data-mode="focus"] .torrent-card.compact {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .compact-body {
      flex: 1;
      min-width: 0;
    }
    .status-glyph {
      --status: var(--muted);
      --status-soft: var(--panel);
      position: relative;
      display: grid;
      flex-shrink: 0;
      place-items: center;
      color: var(--status);
      background: var(--status-soft);
      border-radius: 50%;
    }
    .status-glyph[data-status="downloading"] {
      --status: #b9d39a;
      --status-soft: #2a3523;
    }
    .status-glyph[data-status="seeding"] {
      --status: #e2b56c;
      --status-soft: #3a3020;
    }
    .status-glyph[data-status="error"] {
      --status: #e59a86;
      --status-soft: #3a2721;
    }
    .status-glyph > svg:first-child {
      position: absolute;
      inset: 0;
    }
    .status-glyph circle {
      fill: none;
      stroke-width: 2.5;
    }
    .status-glyph-track {
      stroke: #2c3426;
    }
    .status-glyph-value {
      stroke: var(--status);
      stroke-linecap: round;
    }
    .status-glyph > .icon {
      width: 42%;
      height: 42%;
      stroke-width: 1.7;
    }
    .detail-heading > .status-glyph {
      margin-top: 2px;
    }
    .compact-heading {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .compact-heading .torrent-name {
      flex: 1;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
      line-height: 1.35;
      white-space: nowrap;
    }
    .compact-heading .status {
      flex-shrink: 0;
    }
    .compact-summary {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-top: 5px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--muted);
    }
    .compact-summary .release {
      flex: 1;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
      white-space: nowrap;
    }
    .compact-summary .torrent-destination {
      opacity: 0.75;
    }
    .compact-summary .torrent-size {
      flex-shrink: 0;
    }
    .compact-summary .torrent-rate {
      flex-shrink: 0;
      width: 82px;
      text-align: right;
    }
    .app[data-mode="focus"] .torrent-progress {
      height: 2px;
      margin: 8px 0 0;
    }
    .app[data-mode="focus"] .torrent-card.selected::before {
      top: 11px;
      bottom: 11px;
    }
    .app[data-mode="focus"] .detail-crumb {
      margin-bottom: 20px;
    }
    .app[data-mode="focus"] .detail-heading {
      gap: 12px;
    }
    .app[data-mode="focus"] .detail-heading h2 {
      font-size: 23px;
    }
    .app[data-mode="focus"] .file-symbol {
      width: 42px;
      height: 50px;
    }
    .app[data-mode="focus"] .detail-tabs {
      gap: 16px;
    }
    .app h1,
    .app h2,
    .app h3 {
      color: var(--text);
    }
    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 23px 12px 15px;
      background: var(--nav);
      border-right: 1px solid var(--line);
    }
    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 0 10px;
      margin-bottom: 22px;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.7px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      color: var(--nav);
      background: var(--accent);
      border-radius: 9px;
    }
    .brand-mark svg {
      width: 23px;
      height: 23px;
    }
    .nav-label {
      padding: 23px 10px 9px;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.4px;
    }
    .nav-button {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 10px;
      font-size: 13px;
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 7px;
    }
    .nav-button.active {
      color: var(--accent);
      background: var(--selected);
    }
    .nav-button:hover {
      background: var(--panel);
    }
    .nav-button b {
      margin-left: auto;
      font-size: 10px;
      font-weight: 500;
      opacity: 0.8;
    }
    .icon {
      flex-shrink: 0;
      width: 17px;
      height: 17px;
      vertical-align: middle;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-bottom {
      padding: 17px 9px 0;
      margin-top: auto;
      border-top: 1px solid var(--line);
    }
    .storage-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
    }
    .storage-bar {
      height: 4px;
      margin: 10px 0;
      overflow: hidden;
      background: var(--line);
      border-radius: 4px;
    }
    .storage-bar i {
      display: block;
      width: 97%;
      height: 100%;
      background: var(--accent);
      opacity: 0.6;
    }
    .storage-hint {
      font-size: 10px;
      color: var(--muted);
    }
    .settings {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
    }
    .icon-button {
      display: inline-grid;
      place-items: center;
      padding: 7px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 7px;
    }
    .icon-button:hover {
      color: var(--text);
      background: var(--selected);
    }
    .torrent-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--list);
      border-right: 1px solid var(--line);
    }
    .pane-heading {
      padding: 20px 22px 14px;
    }
    .eyebrow {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.3px;
    }
    .heading-line {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin: 7px 0 3px;
    }
    h1,
    h2,
    h3,
    p {
      margin: 0;
    }
    h1 {
      font-size: 24px;
      font-weight: 550;
      letter-spacing: -0.8px;
    }
    .count {
      margin-left: 5px;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
    }
    .subline {
      margin-top: 5px;
      font-size: 11px;
      color: var(--muted);
    }
    .search {
      display: flex;
      gap: 9px;
      align-items: center;
      padding: 9px 10px;
      margin: 0 22px 14px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 7px;
    }
    .search input {
      width: 100%;
      min-width: 0;
      font-size: 12px;
      color: var(--text);
      outline: none;
      background: transparent;
      border: 0;
    }
    .search input::placeholder {
      color: var(--muted);
    }
    .search kbd {
      padding: 1px 4px;
      font-size: 9px;
      border: 1px solid var(--line);
      border-radius: 3px;
    }
    .filters {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 0 22px 15px;
      border-bottom: 1px solid var(--line);
    }
    .filter {
      padding: 6px 9px;
      font-size: 11px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 5px;
    }
    .filter.active {
      color: var(--accent);
      background: var(--selected);
    }
    .filter em {
      margin-left: 4px;
      font-style: normal;
      opacity: 0.7;
    }
    .sort {
      max-width: 96px;
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      background: var(--list);
      border: 0;
    }
    .torrent-list {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: auto;
      scrollbar-color: var(--line) transparent;
      scrollbar-width: thin;
    }
    .torrent-card {
      position: relative;
      display: block;
      width: 100%;
      padding: 13px 20px 12px;
      color: var(--text);
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
    }
    .torrent-card:hover {
      background: color-mix(in srgb, var(--selected) 40%, transparent);
    }
    .torrent-card.selected {
      background: var(--selected);
    }
    .torrent-card.selected::before {
      position: absolute;
      top: 16px;
      bottom: 16px;
      left: 0;
      width: 3px;
      content: "";
      background: var(--accent);
      border-radius: 0 4px 4px 0;
    }
    .torrent-top {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .status {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      font-size: 10px;
      color: var(--accent);
    }
    .status.seed {
      color: var(--amber);
    }
    .status.error {
      color: var(--danger);
    }
    .status.paused {
      color: var(--muted);
    }
    .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: currentColor;
      border-radius: 50%;
    }
    .torrent-name {
      padding-right: 10px;
      font-size: 14px;
      font-weight: 550;
      line-height: 1.4;
      letter-spacing: -0.1px;
    }
    .release {
      margin-top: 4px;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .torrent-progress {
      height: 3px;
      margin: 10px 0 7px;
      overflow: hidden;
      background: var(--line);
      border-radius: 5px;
    }
    .torrent-progress i {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 5px;
    }
    .torrent-progress.seed i {
      background: var(--amber);
    }
    .torrent-progress.error i {
      background: var(--danger);
    }
    .torrent-meta {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }
    .mono {
      font-family: "SFMono-Regular", Consolas, monospace;
      letter-spacing: -0.2px;
    }
    .detail {
      position: relative;
      min-width: 0;
      padding: 23px 30px;
      overflow: auto;
      background: var(--bg);
    }
    .detail-crumb {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      font-size: 11px;
      color: var(--muted);
    }
    .crumbs {
      display: flex;
      gap: 7px;
      align-items: center;
    }
    .detail-actions {
      display: flex;
      gap: 7px;
    }
    .detail-actions .icon-button {
      padding: 5px;
      border: 0;
    }
    .detail-heading {
      display: flex;
      gap: 15px;
      align-items: flex-start;
    }
    .file-symbol {
      display: grid;
      flex-shrink: 0;
      place-items: center;
      width: 48px;
      height: 57px;
      color: var(--accent);
      background: var(--selected);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .file-symbol .icon {
      width: 25px;
      height: 25px;
    }
    .detail-heading h2 {
      margin-bottom: 8px;
      font-size: 26px;
      font-weight: 550;
      line-height: 1.18;
      letter-spacing: -0.85px;
    }
    .detail-release {
      font-size: 11px;
      line-height: 1.6;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .tags {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 17px;
    }
    .tag {
      padding: 3px 7px;
      font-size: 10px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .primary {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--nav);
      background: var(--accent);
      border: 1px solid transparent;
      border-radius: 6px;
    }
    .app[data-mode="library"] .primary {
      color: #fff;
    }
    .secondary {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      font-size: 11px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .progress-section {
      margin-top: 26px;
    }
    .progress-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 11px;
    }
    .progress-heading strong {
      font-size: 13px;
      font-weight: 500;
    }
    .progress-heading span {
      font-size: 11px;
      color: var(--muted);
    }
    .big-progress {
      height: 5px;
      overflow: hidden;
      background: var(--line);
      border-radius: 6px;
    }
    .big-progress i {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 6px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin: 22px 0;
    }
    .metric {
      padding-left: 16px;
      border-left: 1px solid var(--line);
    }
    .metric:first-child {
      padding: 0;
      border: 0;
    }
    .metric dt {
      margin-bottom: 7px;
      font-size: 10px;
      color: var(--muted);
    }
    .metric dd {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.6px;
    }
    .metric dd small {
      font-size: 11px;

      if (button.dataset.filter) {
        state.filter = button.dataset.filter;
        render();
      }
      if (button.dataset.torrent) {
        state.selected = Number(button.dataset.torrent);
        renderList();
        renderDetail();
      }
      if (button.dataset.tab) {
        state.tab = button.dataset.tab;
        renderDetail();
        document.getElementById(`tab-${state.tab}`).focus({ preventScroll: true });
      }
      const { action } = button.dataset;
      if (action === "pause") {
        const t = torrents.find((item) => item.id === state.selected);
        if (t.status === "Disk full") {
          toast("Prototype: free up space or move this torrent before resuming.");
          return;
        }
        t.status =
          t.status === "Paused" ? (t.progress === 100 ? "Seeding" : "Downloading") : "Paused";
        t.speed = t.status === "Downloading" ? "8.4 MB/s" : "0 B/s";
        t.upload =
          t.status === "Seeding" ? "84 KB/s" : t.status === "Downloading" ? "420 KB/s" : "0 B/s";
        t.peers = t.status === "Paused" ? 0 : 6;
        t.eta = t.status === "Paused" ? "Paused" : t.progress === 100 ? "Complete" : "54 seconds";
        render();
      }
      if (action === "information") {
        state.tab = "Information";
        renderDetail();
      }
      if (action === "folder") {
        toast(`Prototype: this opens ${torrents.find((item) => item.id === state.selected).path}`);
      }
      if (action === "copy") {
        const t = torrents.find((item) => item.id === state.selected);
        try {
          await navigator.clipboard.writeText(t.file);
          toast("Torrent name copied.");
        } catch {
          toast("Clipboard unavailable here. The full filename is in Information.");
        }
      }
      if (["automation", "destination", "settings"].includes(action)) {
        toast(
          {
            automation: "Prototype: automation rules open here.",
            destination: "Prototype: choose a folder and give your destination a name.",
            settings: "Prototype: application preferences open here.",
          }[action]
        );
      }
      if (action === "add") {
        const backdrop = document.createElement("div");
        backdrop.className = "dialog-backdrop";
        backdrop.innerHTML = `<form class="dialog" id="add-form" aria-labelledby="add-title" role="dialog" aria-modal="true"><h3 id="add-title">A new arrival.</h3><p>Add a sample torrent to explore the layout. This prototype does not start real transfers.</p><label for="magnet">Magnet link</label><input id="magnet" name="magnet" placeholder="magnet:?xt=urn:btih:…" required autofocus><label for="new-destination">Destination</label><select id="new-destination" name="destination"><option>Videos</option><option>Music</option><option>Software</option></select><div class="dialog-error" id="dialog-error" role="status"></div><div class="dialog-actions"><button type="button" class="secondary" data-action="cancel">Cancel</button><button type="submit" class="primary">Add sample torrent</button></div></form>`;
        app.append(backdrop);
        document.getElementById("magnet").focus();
      }
      if (action === "cancel") {
        app.querySelector(".dialog-backdrop")?.remove();
        app.querySelector('[data-action="add"]').focus();
      }
    });
    document.addEventListener("input", (event) => {
      if (event.target.id === "torrent-search") {
        state.query = event.target.value;
        renderList();
      }
    });
    document.addEventListener("change", (event) => {
      if (event.target.id === "sort") {
        state.sort = event.target.value;
        renderList();
      }
      if (event.target.hasAttribute("data-priority")) {
        toast(`Sample file priority changed to ${event.target.value}.`);
      }
    });
    document.addEventListener("submit", (event) => {
      if (event.target.id !== "add-form") {
        return;
      }
      event.preventDefault();
      const data = new FormData(event.target);
      const magnet = String(data.get("magnet"));
      const destination = String(data.get("destination"));
      if (!magnet.startsWith("magnet:?")) {
        document.getElementById("dialog-error").textContent =
          "Enter a magnet link starting with magnet:?";
        return;
      }
      const id = Math.max(...torrents.map((t) => t.id)) + 1;
      const example = torrents.find((t) => t.destination === destination);
      const sample = {
        Music: ["sample-album.flac", ["FLAC", "Album"]],
        Software: ["sample-image.iso", ["ISO", "Linux"]],
        Videos: ["sample-download.mkv", ["1080p", "WEB-DL", "MKV"]],
      }[destination];
      torrents.unshift({
        destination,
        episode: "Just added · Sample torrent",
        eta: "Starting",
        file: sample[0],
        files: 1,
        id,
        name: "New sample download",
        path: example.path,
        peers: 0,
        progress: 0,
        ratio: "0.00",
        release: "Prototype transfer",
        size: "1.42 GiB",
        speed: "0 B/s",
        status: "Downloading",
        tags: sample[1],
        upload: "0 B/s",
      });
      state.destination = destination;
      state.filter = "all";
      state.query = "";
      state.selected = id;
      render();
      toast("Sample torrent added. No real download was started.");
    });
    document.addEventListener("keydown", (event) => {
      const dialog = app.querySelector(".dialog");
      if (dialog) {
        if (event.key === "Escape") {
          dialog.parentElement.remove();
          app.querySelector('[data-action="add"]').focus();
        }
        if (event.key === "Tab") {
          const fields = [...dialog.querySelectorAll("input,select,button")];
          const [first] = fields;
          const last = fields.at(-1);
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
        return;
      }
      if (
        event.key === "/" &&
        !["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)
      ) {
        event.preventDefault();
        document.getElementById("torrent-search").focus();
      }
      if (event.target.matches('[role="tab"]') && ["ArrowLeft", "ArrowRight"].includes(event.key)) {
        event.preventDefault();
        const tabs = ["Activity", "Files", "Trackers", "Peers", "Information"];
        state.tab = tabs[(tabs.indexOf(state.tab) + (event.key === "ArrowRight" ? 1 : 4)) % 5];
        renderDetail();
        document.getElementById(`tab-${state.tab}`).focus({ preventScroll: true });
      }
    });
    let observedStageWidth = stage.clientWidth;
    render();
    resize();
    new ResizeObserver(([entry]) => {
      if (entry.contentRect.width !== observedStageWidth) {
        observedStageWidth = entry.contentRect.width;
        resize();
      }
    }).observe(stage);
    </script>
  </body>
</html>
