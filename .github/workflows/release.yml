name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            platform: macos
          - runner: windows-2025
            arch: x64
            platform: win
          - runner: ubuntu-24.04
            arch: x64
            platform: linux
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
      ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
      ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}

    steps:
      - name: Preserve LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            .cache/hutch
          key: tofu-${{ runner.os }}-${{ runner.arch }}-bun-1.4.3-${{ hashFiles('bun.lock', 'furin.config.ts') }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0t64 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2

      - run: bun install --frozen-lockfile

      - name: Prepare release resources
        run: bun run setup
        env:
          NODE_ENV: production

      - name: Validate version and architecture
        run: |
          bun .github/scripts/release.ts validate
          bun -e 'const { version } = await Bun.file("package.json").json(); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("The release tag must match package.json");'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}

      - run: bunx --bun ultracite check

      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        run: bun .github/scripts/release.ts signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: Build release and prepare the Hutch SDK
        run: |
          bun run codegen
          bun --bun furin-electrobun build --env=stable
        env:
          NODE_ENV: production

      - name: Prepare release artifacts
        run: bun .github/scripts/release.ts artifacts

      - run: bun check

      # Native host tests spawn their own Bun processes; limit contention on Windows runners.
      - run: bun run test ${{ runner.os == 'Windows' && '--parallel=2' || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tofu-${{ matrix.platform }}-${{ matrix.arch }}
          path: .furin/electrobun/artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing files
        if: always() && runner.os == 'macOS'
        run: bun .github/scripts/release.ts cleanup

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tofu-*
          merge-multiple: true
          path: .furin/electrobun/artifacts

      - run: bun install --frozen-lockfile

      - name: Publish GitHub release
        run: bun .github/scripts/release.ts publish
        env:
          GH_TOKEN: ${{ github.token }}
