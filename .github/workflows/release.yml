name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            platform: macos
          - runner: windows-2025
            arch: x64
            platform: win
          - runner: ubuntu-24.04
            arch: x64
            platform: linux
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
      ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
      ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
    steps:
      - name: Preserve LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            .cache/hutch
          key: tofu-${{ runner.os }}-${{ runner.arch }}-bun-1.4.3-${{ hashFiles('bun.lock', 'furin.config.ts') }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0t64 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run setup
      - name: Validate version and architecture
        run: |
          bun scripts/release.ts validate
          bun -e 'const { version } = await Bun.file("package.json").json(); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("The release tag must match package.json");'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
      - run: bunx --bun ultracite check
      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        run: bun scripts/release.ts signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - run: bun run build:release
      - run: bun run tscheck
      - run: bun run test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tofu-${{ matrix.platform }}-${{ matrix.arch }}
          path: .furin/electrobun/artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing files
        if: always() && runner.os == 'macOS'
        run: bun scripts/release.ts cleanup
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tofu-*
          merge-multiple: true
          path: .furin/electrobun/artifacts
      - name: Publish GitHub release
        run: bun scripts/release.ts publish
        env:
          GH_TOKEN: ${{ github.token }}
